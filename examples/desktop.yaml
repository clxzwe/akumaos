monitors:
  - name: DP-1
    resolution: 2560x1440
    refresh: 165
    position: 0x0
    scale: 1

  - name: HDMI-A-1
    resolution: 1920x1080
    refresh: 75
    position: 2560x0
    scale: 1

environment:
  XCURSOR_SIZE: 24
  HYPRCURSOR_SIZE: 24
  GTK_THEME: Adwaita-dark

general:
  gaps_in: 5
  gaps_out: 10
  border_size: 2
  active_border_color: "rgba(33ccffee) rgba(00ff99ee) 45deg"
  inactive_border_color: "rgba(595959aa)"
  layout: dwindle
  resize_on_border: true

decoration:
  rounding: 12
  active_opacity: 0.95
  inactive_opacity: 0.85
  blur:
    enabled: true
    size: 8
    passes: 3
    new_optimizations: true
    vibrancy: 0.1696
  shadow:
    enabled: true
    range: 15
    render_power: 3
    color: "rgba(1a1a1aee)"

input:
  kb_layout: us
  sensitivity: 0
  touchpad:
    natural_scroll: true
    tap_to_click: true

autostart:
  services:
    - waybar
    - mako
    - swww-daemon
    - swayosd-server
  wallpaper_path: "~/Pictures/Wallpapers/default.jpg"
