[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "akuma-generator"
version = "0.1.0"
description = "AkumaOS Configuration Generator Engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AkumaOS Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0"
]

[project.scripts]
akuma = "akuma_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
